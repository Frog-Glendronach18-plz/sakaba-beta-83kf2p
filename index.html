<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>酒場ドラフト戦記 β｜ ブラウザで遊べるオートバトラー</title>
<meta name="description" content="仲間を雇って配置し、俯瞰マップの自動戦闘を勝ち抜くオートバトラー『酒場ドラフト戦記』">
<meta name="theme-color" content="#241710">
<!-- SNS共有時のプレビュー（OGP / X カード）。
     これが無いと、X・LINE・Discord にURLを貼っても画像も説明も出ない“ただのリンク”になる。
     og:image は絶対URLでなければ多くのクローラが解決できないため、公開URLを直書きする。

     ■ 画像を差し替えるとき（手順の詳細は README.md「SNS共有プレビュー」）
       1. 原寸は design/ に置く（design/ は build.js の配布対象外＝公開されない）
       2. 1200×630・JPEG に変換して img/ogp.jpg を上書きする
          （og:image:width/height はこの実寸と必ず一致させること。ズレるとX側で切れる）
       3. 下の og:image の ?v= を +1 する ← これを忘れるとクローラが古い画像を出し続ける
          （X・LINE・Discord はURL単位で画像をキャッシュし、中身を差し替えても取り直さない）
     ※反映確認は X の Card Validator など。数分〜数時間の遅延はある -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="酒場ドラフト戦記">
<meta property="og:title" content="酒場ドラフト戦記 — 仲間を集め、最強のシナジーを組み合わせろ">
<meta property="og:description" content="仲間を雇い、配置し、あとは見守るだけ。ブラウザだけで遊べる自動戦闘オートバトラー。登録不要・無料・オフライン対応。">
<meta property="og:url" content="https://frog-glendronach18-plz.github.io/sakaba-beta-83kf2p/">
<meta property="og:image" content="https://frog-glendronach18-plz.github.io/sakaba-beta-83kf2p/img/ogp.jpg?v=2">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="酒場ドラフト戦記のキービジュアル。戦士・騎士・魔法使い・行商人・僧侶が魔王城へ向かう">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="酒場戦記">
<link rel="stylesheet" href="./css/style.css">
<script>
/* 横向きレイアウトを最初の1フレームから適用する（本体JSはページ末尾で読み込まれるため、
   ここで先に html.lay-land を付けないと縦→横のちらつきが出る）。
   判定ロジックは js/render.js の applyLayoutMode() と一致させること。
   ※このブロックに body の閉じタグや script の閉じタグを文字列として書かないこと:
     build.js が最初の body 閉じタグを game.min.js の挿入位置に使うため、ここに書くと
     ビルド後の index.html が壊れる（本体JSが読み込まれなくなる） */
try {
  var m = localStorage.getItem('sakabaLayoutMode_v1') || 'auto';
  var wide = innerWidth >= 600;   // 実測幅でも縛る（render.js の LAND_MIN_W と揃えること）
  if (wide && (m === 'landscape' || (m === 'auto' && matchMedia('(orientation: landscape) and (min-width: 600px)').matches)))
    document.documentElement.classList.add('lay-land');
} catch (e) {}
</script>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="round-badge"><small>ラウンド</small><span id="roundNum">1</span><span id="roundMax">/10</span></div>
    <div id="hearts"></div>
    <div id="vault">
      <span id="goldNum">0</span>
      <span id="pips"></span>
      <span id="interestLabel">+0<small>利子</small></span>
    </div>
    <button id="wgBtn" title="戦況ゲージ表示切替">📊</button>
    <button id="evChip" style="display:none"></button>
    <button id="recBtn">🏆</button>
    <button id="helpBtn">❓</button>
    <button id="muteBtn">🔊</button>
  </div>

  <div id="boardWrap">
    <div id="boardLabel"><span id="enemyLabel">敵陣 — 次の対戦相手</span><span id="teamCount">自陣（下4行に配置）</span></div>
    <div id="warGauge"><div id="wgFill"></div><span id="wgAllyPct"></span><span id="wgFoePct"></span></div>
    <div id="rumorLine"></div>
    <div id="board">
      <div id="fieldgrid"></div>
      <svg id="predictLayer" viewBox="0 0 7 9" preserveAspectRatio="none"></svg>
      <svg id="predictHeads" viewBox="0 0 7 9" preserveAspectRatio="none"></svg>
      <div id="zoneHint"></div>
    </div>
  </div>

  <!-- 横向きレイアウトでは #side が右カラムになる（縦向きでは従来どおり縦に積むだけ） -->
  <div id="side">
    <div id="tabBar">
      <button class="tab on" data-tab="shop">🍺募兵</button>
      <button class="tab" data-tab="syn">✨シナジー</button>
    </div>
    <div id="infoBar"></div>
    <div id="synergy"></div>

    <div id="shopArea">
      <div id="shopTitle"><span id="shopName">🍺 酒場の募兵</span><span id="incomeNote"></span></div>
      <div id="tierOdds"></div>
      <div id="shopCards"></div>
      <div id="battleLog"></div>
      <div id="shopBtns">
        <button class="btn" id="rerollBtn">🎲 1G</button>
        <button class="btn" id="lockModeBtn" title="取り置き">🔒</button>
        <button class="btn" id="capBtn">👥 +1枠</button>
        <button class="btn" id="sellBtn">💰 売却</button>
        <button class="btn" id="fightBtn">⚔️ 戦闘開始</button>
      </div>
    </div>
  </div>
  <div id="tutBox"></div>
</div>

<div id="fx"></div>
<div id="slam"><div id="slamText"></div></div>
<div id="overlay"><div id="panel"></div></div>
<div id="biomeBanner"></div>
<div id="toast"></div>

<!-- 読み込み順は依存関係どおり。最後の ui.js がイベント登録とゲーム起動を行う -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
<script src="./js/game.min.js"></script>
</body>
</html>
